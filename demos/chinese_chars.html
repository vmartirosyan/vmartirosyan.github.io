<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kangxi Radicals Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Better font rendering for Chinese Characters */
        .zh-char {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        }

        .option-btn {
            transition: all 0.2s ease-in-out;
        }

        .option-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .option-btn:not(:disabled):active {
            transform: translateY(0);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar for Study Mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10 flex-shrink-0">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">

                    Quiz Mode
                </button>
                <button id="navStudyBtn" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:text-slate-900" onclick="switchTab('study')">
                    Study Reference
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-hidden relative">
        
        <!-- QUIZ MODE SECTION -->

            <div class="w-full max-w-2xl">
                <!-- Stats Bar -->
                <div class="flex justify-between items-center bg-white px-6 py-4 rounded-2xl shadow-sm border border-slate-100 mb-6">
                    <div class="text-slate-500 font-medium">
                        Score: <span id="scoreDisplay" class="text-indigo-600 font-bold text-lg">0</span>
                    </div>
                    <div class="text-slate-500 font-medium">
                        Streak: <span id="streakDisplay" class="text-amber-500 font-bold text-lg">0</span>
                    </div>
                </div>

                <!-- Quiz Card -->
                <div class="bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-10 flex flex-col items-center w-full">
                    
                    <div class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">What does this radical mean?</div>
                    
                    <!-- Character Display -->
                    <div id="characterDisplay" class="zh-char text-8xl sm:text-9xl font-medium text-slate-800 my-6 drop-shadow-sm select-none">
                        <!-- Character gets injected here -->
                    </div>
                    
                    <!-- Pinyin Reveal (Hidden initially) -->
                    <div id="pinyinDisplay" class="text-xl text-indigo-500 font-medium mb-8 h-8 opacity-0 transition-opacity duration-300">
                        <!-- Pinyin gets injected here -->
                    </div>

                    <!-- Options Grid -->
                    <div id="optionsContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
                        <!-- Buttons get injected here -->
                    </div>

                    <!-- Feedback Area & Next Button -->
                    <div id="feedbackArea" class="mt-8 flex flex-col items-center justify-center min-h-[80px] w-full hidden">
                        <p id="feedbackText" class="text-lg font-bold mb-4"></p>
                        <button id="nextBtn" onclick="nextQuestion()" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold transition-colors shadow-md shadow-indigo-200">
                            Next Character &rarr;
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- STUDY MODE SECTION -->
        <section id="studySection" class="absolute inset-0 overflow-y-auto w-full h-full bg-slate-50 hidden fade-in py-8 px-4">
            <div class="max-w-6xl mx-auto">

                    <!-- Study cards get injected here -->
                </div>
            </div>
        </section>

        // Tab Switching Logic
        function switchTab(tabName) {
            if (tabName === 'quiz') {
                quizSection.classList.remove('hidden');
                studySection.classList.add('hidden');
                
                // Update button styles
                navQuizBtn.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-white shadow-sm text-indigo-700";
                navStudyBtn.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:text-slate-900";
            } else {
                quizSection.classList.add('hidden');
                studySection.classList.remove('hidden');
                
                // Update button styles
                navStudyBtn.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-white shadow-sm text-indigo-700";
                navQuizBtn.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:text-slate-900";

                // Render study grid lazily once
                if (!studyGridRendered) {
                    renderStudyGrid();
                    studyGridRendered = true;
                }
            }
        }

        // --- QUIZ LOGIC ---

        function getRandomRadical() {
            return radicals[Math.floor(Math.random() * radicals.length)];
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuestion() {
            hasAnswered = false;
            feedbackArea.classList.add('hidden');
            pinyinDisplay.style.opacity = '0';
            pinyinDisplay.innerText = '';
            
            // Pick correct answer
            currentQuestion = getRandomRadical();
            
            // Pick 3 unique distractors
            let distractors = [];
            while (distractors.length < 3) {
                let candidate = getRandomRadical();
                // Ensure no duplicate meanings and not the correct answer
                if (candidate.m !== currentQuestion.m && !distractors.find(d => d.m === candidate.m)) {
                    distractors.push(candidate);
                }
            }

            // Combine and shuffle
            currentOptions = shuffleArray([currentQuestion, ...distractors]);

            renderQuizUI();
        }

        function renderQuizUI() {
            // Set Character
            characterDisplay.innerText = currentQuestion.c;

            // Clear and render buttons
            optionsContainer.innerHTML = '';
            currentOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-4 rounded-xl text-lg font-medium border-2 border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:border-indigo-300 focus:outline-none`;
                btn.innerText = option.m.charAt(0).toUpperCase() + option.m.slice(1); // Capitalize first letter
                btn.onclick = () => handleAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            if (hasAnswered) return;
            hasAnswered = true;

            const selectedOption = currentOptions[selectedIndex];
            const isCorrect = selectedOption.m === currentQuestion.m;

            // Disable all buttons
            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-slate-100', 'hover:border-indigo-300', 'cursor-pointer');
                btn.classList.add('cursor-default', 'opacity-80');
            });

            // Reveal Pinyin
            pinyinDisplay.innerText = `Pinyin: ${currentQuestion.p}`;
            pinyinDisplay.style.opacity = '1';

            if (isCorrect) {
                // Correct State
                score += 10;
                streak += 1;
                btnElement.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-700');
                btnElement.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                
                feedbackText.innerText = "Correct! ðŸŽ‰";
                feedbackText.className = "text-xl font-bold text-emerald-600 mb-4";
            } else {
                // Wrong State
                streak = 0;
                btnElement.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-700');
                btnElement.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-700');
                
                // Highlight correct answer
                const correctIndex = currentOptions.findIndex(opt => opt.m === currentQuestion.m);
                const correctBtn = allButtons[correctIndex];
                correctBtn.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-700');
                correctBtn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');

                feedbackText.innerText = `Incorrect. It means "${currentQuestion.m}".`;
                feedbackText.className = "text-xl font-bold text-rose-600 mb-4";
            }

            // Update Stats UI
            scoreDisplay.innerText = score;
            streakDisplay.innerText = streak;

            // Show feedback area
            feedbackArea.classList.remove('hidden');
        }

        function nextQuestion() {
            generateQuestion();
        }

        // --- STUDY MODE LOGIC ---

        function renderStudyGrid() {
            studyGrid.innerHTML = '';
            radicals.forEach((radical, index) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-4 flex flex-col items-center justify-center shadow-sm hover:shadow-md transition-shadow cursor-default group";
                
                // Number
                const numStr = `<div class="w-full text-left text-xs font-semibold text-slate-300 mb-1 group-hover:text-indigo-300 transition-colors">#${index + 1}</div>`;
                
                // Character
                const charStr = `<div class="zh-char text-4xl font-medium text-slate-800 mb-2">${radical.c}</div>`;
                
                // Pinyin
                const pinStr = `<div class="text-sm font-semibold text-indigo-500 mb-1">${radical.p}</div>`;
                
                // Meaning
                const meanStr = `<div class="text-xs text-slate-500 text-center uppercase tracking-wide">${radical.m}</div>`;
                
                card.innerHTML = numStr + charStr + pinStr + meanStr;
                studyGrid.appendChild(card);
            });
        }

        // Initialize Game
        window.onload = function() {
            generateQuestion();
        };

    </script>
</body>
</html>
