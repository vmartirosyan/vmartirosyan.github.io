<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kangxi Radicals Mastery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .app-viewport {
            height: 100vh;
            height: 100dvh;
        }

        /* Better font rendering for Chinese Characters */
        .zh-char {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        }

        .option-btn {
            transition: all 0.2s ease-in-out;
        }

        .option-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .option-btn:not(:disabled):active {
            transform: translateY(0);
        }

        .option-btn:focus-visible,
        .quiz-next-btn:focus-visible,
        .lang-btn:focus-visible,
        #sectionTabs button:focus-visible,
        #modeTabs button:focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            color: #475569;
            transition: all 0.15s ease-in-out;
        }

        .lang-btn:hover {
            background-color: #e2e8f0;
        }

        .lang-btn.active {
            background-color: #ffffff;
            color: #4338ca;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .lang-btn .flag {
            display: block;
            width: 18px;
            height: 12px;
            border-radius: 2px;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.12);
        }

        .lang-btn:not(.active) .flag {
            opacity: 0.65;
        }

        .trad-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 15px;
            height: 15px;
            border-radius: 9999px;
            border: 1px solid #cbd5e1;
            background-color: transparent;
            color: #64748b;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            padding: 0;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
        }

        .trad-toggle:hover,
        .trad-toggle.open {
            background-color: #eef2ff;
            border-color: #818cf8;
            color: #4338ca;
        }

        .trad-note {
            margin-top: 4px;
            font-size: 10px;
            line-height: 1.35;
            color: #64748b;
            text-align: center;
        }

        /* Custom Scrollbar for Study Mode */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .app-header__inner {
            display: flex;
            align-items: center;
            gap: 0.5rem 0.75rem;
            padding: 0.55rem 1rem;
        }

        .app-brand {
            flex: 1 1 0;
            min-width: 0;
        }

        .app-brand__logo {
            width: 2.25rem;
            height: 2.25rem;
            font-size: 1.1rem;
        }

        .app-brand__title {
            font-size: 1.05rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #sectionTabs {
            flex: 0 1 auto;
            min-width: 0;
            justify-content: center;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #sectionTabs::-webkit-scrollbar,
        #utilityControls::-webkit-scrollbar {
            display: none;
        }

        #sectionTabs button {
            flex-shrink: 0;
            padding: 0.4rem 0.65rem;
            font-size: 0.7rem;
            line-height: 1.25;
        }

        #utilityControls {
            display: flex;
            flex: 1 1 auto;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: none;
        }

        #modeTabs button {
            padding: 0.4rem 0.7rem;
            font-size: 0.72rem;
            line-height: 1.25;
            white-space: nowrap;
        }

        .quiz-section {
            padding: 0.75rem clamp(0.75rem, 2vw, 1.25rem);
        }

        .quiz-section.has-answer {
            padding-bottom: 7rem;
        }

        .quiz-shell {
            width: 100%;
            max-width: 56rem;
            margin: 0 auto;
        }

        .quiz-card {
            width: 100%;
            padding: clamp(1rem, 2.5vw, 1.5rem);
        }

        .quiz-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.65rem;
            padding-bottom: 0.65rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .quiz-stats {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .quiz-stat {
            display: inline-flex;
            align-items: baseline;
            gap: 0.3rem;
            padding: 0.3rem 0.55rem;
            border-radius: 0.55rem;
            background: #f8fafc;
            color: #64748b;
            font-size: 0.68rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .quiz-stat span {
            font-size: 0.9rem;
            line-height: 1;
        }

        .quiz-board {
            display: grid;
            grid-template-columns: minmax(13rem, 0.8fr) minmax(0, 1.4fr);
            align-items: center;
            gap: 1.5rem;
        }

        .quiz-character-panel {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-right: 1.5rem;
            border-right: 1px solid #f1f5f9;
        }

        .quiz-character {
            margin: 0.45rem 0 0.15rem;
            line-height: 1;
            text-align: center;
        }

        .quiz-pinyin {
            min-height: 1.5rem;
            margin: 0.25rem 0 0;
            font-size: 1rem;
            line-height: 1.5;
            text-align: center;
        }

        #quizTradNote {
            margin: 0.25rem 0 0;
            max-width: 22rem;
        }

        #optionsContainer {
            gap: 0.6rem;
        }

        .option-btn {
            min-height: 2.85rem;
            padding: 0.65rem 0.8rem;
            line-height: 1.25;
        }

        .quiz-feedback {
            position: fixed;
            left: 50%;
            bottom: max(0.75rem, env(safe-area-inset-bottom));
            z-index: 50;
            display: flex;
            width: min(calc(100% - 1.5rem), 48rem);
            align-items: center;
            gap: 0.65rem 1rem;
            padding: 0.65rem;
            border: 1px solid rgba(226, 232, 240, 0.95);
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.97);
            box-shadow: 0 14px 35px -12px rgba(15, 23, 42, 0.3), 0 2px 6px rgba(15, 23, 42, 0.06);
            transform: translateX(-50%);
            backdrop-filter: blur(10px);
            animation: feedbackIn 0.2s ease-out;
        }

        .quiz-feedback.hidden {
            display: none;
        }

        .quiz-feedback__text {
            flex: 1 1 15rem;
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.35;
            text-align: left;
        }

        .quiz-next-btn {
            min-height: 2.75rem;
            flex: 0 0 auto;
            margin-left: auto;
            padding: 0.65rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        @keyframes feedbackIn {
            from { opacity: 0; transform: translate(-50%, 0.5rem); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        @media (max-width: 960px) {
            .app-header__inner {
                flex-wrap: wrap;
                gap: 0.45rem;
            }

            #sectionTabs {
                order: 2;
                flex-basis: 100%;
                justify-content: flex-start;
            }

            #utilityControls {
                margin-left: auto;
            }
        }

        @media (max-width: 760px) {
            .quiz-board {
                grid-template-columns: 1fr;
                gap: 0.55rem;
            }

            .quiz-character-panel {
                padding: 0 0 0.25rem;
                border-right: 0;
            }

            .quiz-character {
                font-size: 4.5rem !important;
                margin-top: 0.2rem;
            }

            .quiz-feedback {
                align-items: stretch;
                flex-wrap: wrap;
                padding: 0.6rem;
            }

            .quiz-section.has-answer {
                padding-bottom: 8.5rem;
            }

            .quiz-feedback__text {
                flex-basis: 100%;
            }

            .quiz-next-btn {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .app-brand {
                flex: 0 0 auto;
            }

            .app-brand__title {
                display: none;
            }

            .app-brand__logo {
                width: 2rem;
                height: 2rem;
            }

            .lang-btn span {
                display: none;
            }

            .lang-btn {
                padding: 0.35rem;
            }

            .quiz-topline {
                align-items: flex-start;
            }

            #questionPrompt {
                font-size: 0.68rem;
                line-height: 1.3;
            }

            .quiz-stat {
                padding: 0.25rem 0.4rem;
                font-size: 0.62rem;
            }

            .option-btn {
                min-height: 2.55rem;
                padding: 0.55rem 0.7rem;
                font-size: 0.92rem;
            }
        }

        @media (max-width: 380px) {
            .app-header__inner {
                padding-inline: 0.6rem;
            }

            #modeTabs button {
                padding-inline: 0.5rem;
            }
        }
    </style>
</head>
<body class="app-viewport text-slate-800 flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10 flex-shrink-0">
        <div class="app-header__inner max-w-7xl mx-auto">
            <div class="app-brand flex items-center gap-2">
                <div class="app-brand__logo bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold zh-char">
                    漢
                </div>
                <h1 id="headerTitle" class="app-brand__title font-bold text-slate-800">Kangxi Radicals</h1>
            </div>
            <div id="sectionTabs" class="flex bg-indigo-50 p-1 rounded-lg" role="tablist" aria-label="Section">
                    <button id="secKangxiBtn" class="px-3 py-2 rounded-md font-semibold text-xs sm:text-sm transition-colors bg-white shadow-sm text-indigo-700" onclick="switchSection('kangxi')">
                        Kangxi Radicals
                    </button>
                    <button id="secHskBtn" class="px-3 py-2 rounded-md font-semibold text-xs sm:text-sm transition-colors text-indigo-500 hover:text-indigo-700" onclick="switchSection('hsk')">
                        HSK 3.0 Level 1
                    </button>
                    <button id="secPrimitiveBtn" class="px-3 py-2 rounded-md font-semibold text-xs sm:text-sm transition-colors text-indigo-500 hover:text-indigo-700" onclick="switchSection('primitives')">
                        Modern Primitives
                    </button>
            </div>
            <div id="utilityControls">
                <div id="modeTabs" class="flex bg-slate-100 p-1 rounded-lg" role="tablist">
                    <button id="navQuizBtn" class="px-4 py-2 rounded-md font-medium text-sm transition-colors bg-white shadow-sm text-indigo-700" onclick="switchTab('quiz')">
                        Quiz Mode
                    </button>
                    <button id="navStudyBtn" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:text-slate-900" onclick="switchTab('study')">
                        Study Reference
                    </button>
                </div>
                <div id="langSwitch" class="flex bg-slate-100 p-1 rounded-lg" role="group" aria-label="Language">
                    <button class="lang-btn active" data-lang="en" aria-label="English" aria-pressed="true" title="English">
                        <svg class="flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
                            <rect width="24" height="16" fill="#ffffff"/>
                            <g fill="#b22234">
                                <rect width="24" height="1.231"/>
                                <rect y="2.462" width="24" height="1.231"/>
                                <rect y="4.923" width="24" height="1.231"/>
                                <rect y="7.385" width="24" height="1.231"/>
                                <rect y="9.846" width="24" height="1.231"/>
                                <rect y="12.308" width="24" height="1.231"/>
                                <rect y="14.769" width="24" height="1.231"/>
                            </g>
                            <rect width="9.6" height="8.615" fill="#3c3b6e"/>
                            <g fill="#ffffff">
                                <circle cx="1.2" cy="1.4" r="0.32"/><circle cx="2.9" cy="1.4" r="0.32"/><circle cx="4.6" cy="1.4" r="0.32"/><circle cx="6.3" cy="1.4" r="0.32"/><circle cx="8" cy="1.4" r="0.32"/>
                                <circle cx="2.05" cy="3.2" r="0.32"/><circle cx="3.75" cy="3.2" r="0.32"/><circle cx="5.45" cy="3.2" r="0.32"/><circle cx="7.15" cy="3.2" r="0.32"/>
                                <circle cx="1.2" cy="5" r="0.32"/><circle cx="2.9" cy="5" r="0.32"/><circle cx="4.6" cy="5" r="0.32"/><circle cx="6.3" cy="5" r="0.32"/><circle cx="8" cy="5" r="0.32"/>
                                <circle cx="2.05" cy="6.8" r="0.32"/><circle cx="3.75" cy="6.8" r="0.32"/><circle cx="5.45" cy="6.8" r="0.32"/><circle cx="7.15" cy="6.8" r="0.32"/>
                            </g>
                        </svg><span>EN</span>
                    </button>
                    <button class="lang-btn" data-lang="hy" aria-label="Հայերեն" aria-pressed="false" title="Հայերեն">
                        <svg class="flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
                            <rect width="24" height="5.333" fill="#d90012"/>
                            <rect y="5.333" width="24" height="5.333" fill="#0033a0"/>
                            <rect y="10.667" width="24" height="5.333" fill="#f2a800"/>
                        </svg><span>HY</span>
                    </button>
                    <button class="lang-btn" data-lang="ru" aria-label="Русский" aria-pressed="false" title="Русский">
                        <svg class="flag" viewBox="0 0 24 16" aria-hidden="true" focusable="false">
                            <rect width="24" height="5.333" fill="#ffffff"/>
                            <rect y="5.333" width="24" height="5.333" fill="#0039a6"/>
                            <rect y="10.667" width="24" height="5.333" fill="#d52b1e"/>
                        </svg><span>RU</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-hidden relative">
        
        <!-- QUIZ MODE SECTION -->
        <section id="quizSection" class="quiz-section absolute inset-0 overflow-y-auto w-full h-full flex flex-col items-center fade-in">
            
            <div class="quiz-shell">
                <!-- Quiz Card -->
                <div class="quiz-card bg-white rounded-2xl shadow-lg border border-slate-100">
                    <div class="quiz-topline">
                        <div id="questionPrompt" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">What does this radical mean?</div>
                        <div class="quiz-stats">
                            <div class="quiz-stat">
                                <span id="scoreLabel">Score</span>
                                <span id="scoreDisplay" class="text-indigo-600 font-bold">0</span>
                            </div>
                            <div class="quiz-stat">
                                <span id="streakLabel">Streak</span>
                                <span id="streakDisplay" class="text-amber-500 font-bold">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="quiz-board">
                        <div class="quiz-character-panel">
                            <!-- Character Display -->
                            <div id="characterDisplay" class="zh-char quiz-character text-7xl sm:text-8xl font-medium text-slate-800 drop-shadow-sm select-none">
                                <!-- Character gets injected here -->
                            </div>

                            <!-- Pinyin Reveal (Hidden initially) -->
                            <div id="pinyinDisplay" class="quiz-pinyin text-indigo-500 font-medium opacity-0 transition-opacity duration-300">
                                <!-- Pinyin gets injected here -->
                            </div>

                            <div id="quizTradNote" class="text-xs leading-snug text-slate-500 text-center px-2 hidden"></div>
                        </div>

                        <div class="quiz-answer-panel">
                            <!-- Options Grid -->
                            <div id="optionsContainer" class="grid grid-cols-1 gap-3 w-full">
                                <!-- Buttons get injected here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pinned feedback and Next action -->
            <div id="feedbackArea" class="quiz-feedback hidden" role="status" aria-live="polite">
                <p id="feedbackText" class="quiz-feedback__text font-bold"></p>
                <button id="nextBtn" onclick="nextQuestion()" class="quiz-next-btn bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition-colors shadow-md shadow-indigo-200">
                    Next Character &rarr;
                </button>
            </div>
        </section>

        <!-- STUDY MODE SECTION -->
        <section id="studySection" class="absolute inset-0 overflow-y-auto w-full h-full bg-slate-50 hidden fade-in py-8 px-4">
            <div class="max-w-6xl mx-auto">
                <div class="mb-8 text-center">
                    <h2 id="studyTitle" class="text-2xl font-bold text-slate-800">All 214 Kangxi Radicals</h2>
                    <p id="studySubtitle" class="text-slate-500 mt-2">Browse and memorize the fundamental building blocks of Chinese characters. Tap i for traditional meanings.</p>
                    <div id="hskViewToggle" class="hidden mt-4 inline-flex bg-slate-100 p-1 rounded-lg" role="tablist" aria-label="HSK view">
                        <button id="hskWordsBtn" class="px-4 py-2 rounded-md font-medium text-sm transition-colors bg-white shadow-sm text-indigo-700" onclick="switchHskView('words')">
                            Words (300)
                        </button>
                        <button id="hskCharsBtn" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:text-slate-900" onclick="switchHskView('chars')">
                            Characters (248)
                        </button>
                    </div>
                </div>
                
                <div id="studyGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-12">
                    <!-- Study cards get injected here -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // Complete Dataset of all 214 Kangxi Radicals (Simplified Versions)
        const radicals = [
            { c: "一", p: "yī", en: ["one"], ru: ["один"], hy: ["մեկ"] },
            { c: "丨", p: "gǔn", en: ["line"], ru: ["черта"], hy: ["գիծ"] },
            { c: "丶", p: "zhǔ", en: ["dot"], ru: ["точка"], hy: ["կետ"] },
            { c: "丿", p: "piě", en: ["left-falling stroke"], ru: ["откидная черта"], hy: ["ձախ թեքություն"] },
            { c: "乙", p: "yǐ", en: ["second"], ru: ["второй"], hy: ["երկրորդ"] },
            { c: "亅", p: "jué", en: ["hook"], ru: ["крючок"], hy: ["կեռիկ"] },
            { c: "二", p: "èr", en: ["two"], ru: ["два"], hy: ["երկու"] },
            { c: "亠", p: "tóu", en: ["lid"], ru: ["крышка"], hy: ["կափարիչ"] },
            { c: "人", p: "rén", en: ["person"], ru: ["человек"], hy: ["մարդ"] },
            { c: "儿", p: "ér", en: ["son","child"], ru: ["сын","ребёнок"], hy: ["որդի","երեխա"], trad: { en: ["legs"], ru: ["ноги"], hy: ["ոտքեր"] } },
            { c: "入", p: "rù", en: ["enter"], ru: ["входить"], hy: ["մտնել"] },
            { c: "八", p: "bā", en: ["eight"], ru: ["восемь"], hy: ["ութ"] },
            { c: "冂", p: "jiōng", en: ["box"], ru: ["рамка"], hy: ["շրջանակ"] },
            { c: "冖", p: "mì", en: ["cover"], ru: ["крышка"], hy: ["ծածկույթ"] },
            { c: "冫", p: "bīng", en: ["ice"], ru: ["лёд"], hy: ["սառույց"] },
            { c: "几", p: "jī", en: ["table"], ru: ["стол"], hy: ["սեղան"] },
            { c: "凵", p: "kǎn", en: ["open box"], ru: ["открытая рамка"], hy: ["բաց շրջանակ"] },
            { c: "刀", p: "dāo", en: ["knife"], ru: ["нож"], hy: ["դանակ"] },
            { c: "力", p: "lì", en: ["power"], ru: ["сила"], hy: ["ուժ"] },
            { c: "勹", p: "bāo", en: ["wrap"], ru: ["обёртывать"], hy: ["փաթաթել"] },
            { c: "匕", p: "bǐ", en: ["spoon"], ru: ["ложка"], hy: ["գդալ"] },
            { c: "匚", p: "fāng", en: ["right-open box"], ru: ["рамка, открытая справа"], hy: ["շրջանակ՝ բացված աջ"] },
            { c: "匸", p: "xǐ", en: ["conceal"], ru: ["скрывать"], hy: ["թաքցնել"] },
            { c: "十", p: "shí", en: ["ten"], ru: ["десять"], hy: ["տասը"] },
            { c: "卜", p: "bǔ", en: ["divination"], ru: ["гадание"], hy: ["գուշակություն"] },
            { c: "卩", p: "jié", en: ["seal"], ru: ["печать"], hy: ["կնիք"] },
            { c: "厂", p: "chǎng", en: ["factory"], ru: ["завод"], hy: ["գործարան"], trad: { p: "hǎn", en: ["cliff"], ru: ["утёс"], hy: ["ժայռ"] } },

        function localizedPos(pos) {
            if (currentLang === 'en') return pos;
            const labels = posAbbreviations[currentLang] || {};
            return pos.split('/').map(part => labels[part] || part).join('/');
        }

        function isHsk() {
            return currentSection === 'hsk';
        }

        function isPrimitive() {
            return currentSection === 'primitives';
        }

        function activeData() {
            if (isPrimitive()) return primitives;
            return isHsk() ? hskWords : radicals;
        }

        function meaningText(item) {
            if (isPrimitive()) return item[currentLang];
            if (isHsk()) return item[currentLang] || item.en;
            return item[currentLang].join('; ');
        }

        function itemDisplay(item) {
            return item.w || item.c;
        }

        function tradText(item) {
            const trad = item.trad;
            if (!trad) return '';
            const meanings = (trad[currentLang] || []).join('; ');
            let prefix = '';
            if (trad.char) prefix = trad.char;
            if (trad.p) prefix += prefix ? ` (${trad.p})` : trad.p;
            return prefix ? `${t().traditional}: ${prefix} — ${meanings}` : `${t().traditional}: ${meanings}`;
        }

        function capitalize(text) {
            return text.charAt(0).toUpperCase() + text.slice(1);
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function highlightHskChars(text) {
            return [...text].map(ch => hskExtraChars.has(ch)
                ? `<span class="text-amber-600 font-semibold" title="${escapeHtml(t().extra)}">${escapeHtml(ch)}</span>`
                : escapeHtml(ch)).join('');
        }

        function sharesMeaning(a, b) {
            if (isPrimitive()) return a[currentLang] === b[currentLang];
            if (isHsk()) return meaningText(a) === meaningText(b);
            return a[currentLang].some(meaning => b[currentLang].includes(meaning));
        }

            document.documentElement.lang = currentLang;
            document.title = isPrimitive() ? t().primitiveTitle : isHsk() ? t().hskTitle : t().title;

            headerTitle.textContent = isPrimitive() ? t().primitiveHeader : isHsk() ? t().hskHeader : t().header;
            secKangxiBtn.textContent = t().sectionKangxi;
            secHskBtn.textContent = t().sectionHsk;
            secPrimitiveBtn.textContent = t().sectionPrimitive;
            navQuizBtn.textContent = t().quizTab;
            navStudyBtn.textContent = t().studyTab;
            scoreLabel.textContent = t().score;
            streakLabel.textContent = t().streak;
            questionPrompt.textContent = isPrimitive() ? t().primitiveQuestion : isHsk() ? t().hskQuestion : t().question;
            nextBtn.textContent = isPrimitive() ? t().primitiveNext : isHsk() ? t().hskNext : t().next;

            if (isPrimitive()) {
                studyTitle.textContent = t().primitiveStudyHeading;
                studySubtitle.textContent = t().primitiveStudySubtitle;
            } else if (!isHsk()) {
                studyTitle.textContent = t().studyHeading;
                studySubtitle.textContent = t().studySubtitle;
            } else if (hskStudyView === 'words') {
                studyTitle.textContent = t().hskWordsHeading;
                studySubtitle.textContent = t().hskWordsSubtitle;
            } else {
                studyTitle.textContent = t().hskCharsHeading;
                studySubtitle.textContent = t().hskCharsSubtitle;
            }

            hskViewToggle.classList.toggle('hidden', !isHsk());
            hskWordsBtn.textContent = `${t().words} (${hskWords.length})`;
            hskCharsBtn.textContent = `${t().characters} (${hskCharacters.length})`;

            langSwitch.querySelectorAll('.lang-btn').forEach(btn => {
                const isActive = btn.dataset.lang === currentLang;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', String(isActive));
            });

            updateSectionStyles();
            updateTabStyles();
            updateHskViewStyles();
        }

        function setLanguage(lang) {
            if (!I18N[lang]) lang = 'en';
            currentLang = lang;

            try {
                localStorage.setItem(LANG_STORAGE_KEY, lang);
            } catch {}

            updateTexts();

            if (currentQuestion) {
                if (!hasAnswered) buildOptions();
                renderQuizUI();
            }
            renderStudyGrid();
        }

        langSwitch.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        function saveQuizState() {
            savedQuizStates[currentSection] = {
                score,
                streak,
                currentQuestion,
                currentOptions,
                selectedIndex,
                hasAnswered,
                feedbackKind
            };
        }

        function loadQuizState(section) {
            const saved = savedQuizStates[section];
            if (saved) {
                ({ score, streak, currentQuestion, currentOptions, selectedIndex, hasAnswered, feedbackKind } = saved);
            } else {
                score = 0;
                streak = 0;
                currentQuestion = null;
                currentOptions = [];
                selectedIndex = null;
                hasAnswered = false;
                feedbackKind = null;
            }
            updateScoreUI();
        }

        function switchSection(section) {
            if (section !== 'kangxi' && section !== 'hsk' && section !== 'primitives') return;
            if (section === currentSection) return;

            saveQuizState();
            currentSection = section;
            loadQuizState(section);
            updateTexts();

            if (!currentQuestion) {
                generateQuestion();
            } else {
                renderQuizUI();
            }
            renderStudyGrid();
        }

        function switchHskView(view) {
            if (view !== 'words' && view !== 'chars') return;
            hskStudyView = view;
            updateTexts();
            renderStudyGrid();
        }

        // Tab Switching Logic
        function switchTab(tabName) {
            currentTab = tabName === 'study' ? 'study' : 'quiz';

            if (currentTab === 'quiz') {
                quizSection.classList.remove('hidden');
                studySection.classList.add('hidden');
            } else {
                quizSection.classList.add('hidden');
                studySection.classList.remove('hidden');
                renderStudyGrid();
            }

            updateTabStyles();
        }

        // --- QUIZ LOGIC ---

        function getRandomItem() {
            const data = activeData();
            return data[Math.floor(Math.random() * data.length)];
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function generateQuestion() {
            hasAnswered = false;
            selectedIndex = null;
            feedbackKind = null;
            feedbackArea.classList.add('hidden');
            pinyinDisplay.style.opacity = '0';
            pinyinDisplay.textContent = '';
            
            // Pick correct answer
            currentQuestion = getRandomItem();

            buildOptions();
            renderQuizUI();
        }

        function buildOptions() {
            // Pick 3 unique distractors, avoiding identical meanings
            const data = activeData();
            let distractors = [];
            let attempts = 0;

            while (distractors.length < 3 && attempts < 5000) {
                attempts++;
                const candidate = getRandomItem();
                if (candidate === currentQuestion) continue;

                if (isHsk()) {
                    const candidateMeaning = meaningText(candidate);
                    if (candidateMeaning === meaningText(currentQuestion)) continue;
                    if (distractors.some(d => meaningText(d) === candidateMeaning)) continue;
                } else {
                    if (candidate.c === currentQuestion.c) continue;
                    if (sharesMeaning(candidate, currentQuestion)) continue;
                    if (distractors.some(d => sharesMeaning(d, candidate))) continue;
                }

                distractors.push(candidate);
            }

            if (distractors.length < 3) {
                for (const candidate of shuffleArray(data.slice())) {
                    if (candidate === currentQuestion || distractors.includes(candidate)) continue;
                    distractors.push(candidate);
                    if (distractors.length === 3) break;
                }
            }

            // Combine and shuffle
            currentOptions = shuffleArray([currentQuestion, ...distractors]);
            selectedIndex = null;
        }

        function renderQuizUI() {
            // Set Character or Word
            const display = itemDisplay(currentQuestion);
            const length = [...display].length;
            const sizeClass = length > 3 ? 'text-3xl sm:text-4xl' : length > 1 ? 'text-5xl sm:text-6xl' : 'text-7xl sm:text-8xl';
            characterDisplay.className = `zh-char quiz-character ${sizeClass} font-medium text-slate-800 drop-shadow-sm select-none`;
            characterDisplay.textContent = display;

            if (!isHsk() && currentQuestion.trad && currentQuestion.trad.char) {
                const tradChar = document.createElement('span');
                tradChar.className = 'text-2xl sm:text-3xl text-slate-400 font-normal align-middle ml-2';
                tradChar.textContent = `(${currentQuestion.trad.char})`;
                characterDisplay.appendChild(tradChar);
            }

            // Clear and render buttons
            optionsContainer.className = "grid grid-cols-1 sm:grid-cols-2 gap-3 w-full";
            optionsContainer.innerHTML = '';
            currentOptions.forEach((option, index) => {
                const btn = document.createElement('button');
                const isCorrectOption = option === currentQuestion;
                const isSelectedOption = index === selectedIndex;

                let stateClasses = 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 hover:border-indigo-300';

                if (hasAnswered) {
                    if (isCorrectOption) {
                        stateClasses = 'border-emerald-500 bg-emerald-50 text-emerald-700';
                    } else if (isSelectedOption) {
                        stateClasses = 'border-rose-500 bg-rose-50 text-rose-700';
                    }
                }

                const textSize = isHsk() ? 'text-sm sm:text-base' : 'text-lg';
                btn.className = `option-btn w-full p-4 rounded-xl ${textSize} font-medium border-2 focus:outline-none ${hasAnswered ? 'cursor-default opacity-80' : ''} ${stateClasses}`;
                btn.textContent = capitalize(meaningText(option));
                btn.disabled = hasAnswered;
                btn.onclick = () => handleAnswer(index);
                optionsContainer.appendChild(btn);
            });

            if (hasAnswered) {
                pinyinDisplay.textContent = `${t().pinyin}: ${currentQuestion.p}`;
                pinyinDisplay.style.opacity = '1';

                if (isHsk()) {
                    quizTradNote.textContent = `${t().partOfSpeech}: ${currentQuestion.pos}`;
                    quizTradNote.classList.remove('hidden');
                } else if (currentQuestion.trad) {
                    quizTradNote.textContent = tradText(currentQuestion);
                    quizTradNote.classList.remove('hidden');
                } else {
                    quizTradNote.textContent = '';
                    quizTradNote.classList.add('hidden');
                }

                if (feedbackKind === 'correct') {
                    feedbackText.textContent = t().correct;
                    feedbackText.className = "quiz-feedback__text font-bold text-emerald-600";
                } else {
                    feedbackText.textContent = t().incorrect(meaningText(currentQuestion));
                    feedbackText.className = "quiz-feedback__text font-bold text-rose-600";
                }

                feedbackArea.classList.remove('hidden');
            } else {
                pinyinDisplay.textContent = '';
                pinyinDisplay.style.opacity = '0';
                quizTradNote.textContent = '';
                quizTradNote.classList.add('hidden');
                feedbackArea.classList.add('hidden');
            }

            quizSection.classList.toggle('has-answer', hasAnswered);
        }

        function handleAnswer(index) {
            if (hasAnswered) return;
            hasAnswered = true;
            selectedIndex = index;

            const selectedOption = currentOptions[index];
            const isCorrect = selectedOption === currentQuestion;

            // Reveal Pinyin
            pinyinDisplay.textContent = `${t().pinyin}: ${currentQuestion.p}`;
            pinyinDisplay.style.opacity = '1';

            if (isCorrect) {
                // Correct State
                score += 10;
                streak += 1;
                feedbackKind = 'correct';
            } else {
                // Wrong State
                streak = 0;
                feedbackKind = 'incorrect';
            }

            // Update Stats UI
            scoreDisplay.textContent = score;
            streakDisplay.textContent = streak;

            renderQuizUI();
            requestAnimationFrame(() => nextBtn.focus({ preventScroll: true }));
        }

        function nextQuestion() {
            quizSection.scrollTop = 0;
            generateQuestion();
        }

        // --- STUDY MODE LOGIC ---

        function renderStudyGrid() {
            studyGrid.innerHTML = '';

            if (isPrimitive()) {
                renderPrimitiveGrid();
                return;
            }

            if (isHsk()) {
                if (hskStudyView === 'words') {
                    renderHskWords();
                } else {
                    renderHskCharacters();
                }
                return;
            }

            studyGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-12";
            radicals.forEach((radical, index) => {
                const card = document.createElement('div');
                card.className = "study-card bg-white border border-slate-200 rounded-xl p-4 flex flex-col items-center justify-center shadow-sm hover:shadow-md transition-shadow cursor-default group";
                
                // Number
                const numStr = `<div class="w-full text-left text-xs font-semibold text-slate-300 mb-1 group-hover:text-indigo-300 transition-colors">#${index + 1}</div>`;
                
                // Character
                const charStr = `<div class="zh-char text-4xl font-medium text-slate-800 mb-2">${radical.c}</div>`;
                
                // Pinyin
                const pinStr = `<div class="text-sm font-semibold text-indigo-500 mb-1">${radical.p}</div>`;
                
                // Meaning, with a marker when a traditional reading exists
                const trad = tradText(radical);
                const markerStr = trad ? `<button type="button" class="trad-toggle" aria-expanded="false" aria-label="${t().showTraditional}" title="${t().showTraditional}">i</button>` : '';
                const meanStr = `<div class="flex items-center justify-center gap-1 text-[11px] leading-snug text-slate-500 text-center"><span>${capitalize(meaningText(radical))}</span>${markerStr}</div>`;
                const tradNoteStr = trad ? `<div class="trad-note hidden">${trad}</div>` : '';
                
                card.innerHTML = numStr + charStr + pinStr + meanStr + tradNoteStr;
                studyGrid.appendChild(card);
            });

            attachTradToggles();
        }

        function attachTradToggles() {
            studyGrid.querySelectorAll('.trad-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const noteEl = btn.closest('.study-card').querySelector('.trad-note');
                    if (!noteEl) return;
                    const isHidden = noteEl.classList.toggle('hidden');
                    btn.setAttribute('aria-expanded', String(!isHidden));
                    btn.classList.toggle('open', !isHidden);
                });
            });
        }

        function renderHskWords() {
            studyGrid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-12";

            hskWords.forEach((word, index) => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-4 flex flex-col shadow-sm hover:shadow-md transition-shadow";
                card.innerHTML = `
                    <div class="w-full flex items-start justify-between gap-2 mb-1">
                        <span class="text-xs font-semibold text-slate-300">#${index + 1}</span>
                        <span class="text-[10px] font-semibold text-indigo-500 bg-indigo-50 rounded px-1.5 py-0.5">${escapeHtml(localizedPos(word.pos))}</span>
                    </div>
                    <div class="zh-char text-3xl font-medium text-slate-800 text-center">${highlightHskChars(word.w)}</div>
                    <div class="text-sm font-semibold text-indigo-500 text-center mt-1">${escapeHtml(word.p)}</div>
                    <div class="text-xs leading-snug text-slate-500 mt-2">${escapeHtml(meaningText(word))}</div>
                `;
                studyGrid.appendChild(card);
            });
        }

        function renderHskCharacters() {
            studyGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 pb-12";
            const langIndex = { en: 0, ru: 1, hy: 2 }[currentLang];

            hskCharacters.forEach((entry, index) => {
                const card = document.createElement('div');
                card.className = `study-card border rounded-xl p-3 flex flex-col items-center shadow-sm hover:shadow-md transition-shadow ${entry.extra ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'}`;
                const badge = entry.extra
                    ? `<span class="text-[9px] font-bold uppercase tracking-wide text-amber-700 bg-amber-100 border border-amber-200 rounded px-1 py-0.5">${escapeHtml(t().extra)}</span>`
                    : '';
                const examples = entry.examples.map(escapeHtml).join(' · ');
                const meanings = hskCharMeanings[entry.c];
                const meaning = meanings ? meanings[langIndex] : '';
                card.innerHTML = `
                    <div class="w-full flex items-start justify-between gap-1 mb-1">
                        <span class="text-[10px] font-semibold text-slate-300">#${index + 1}</span>
                        ${badge}
                    </div>
                    <div class="zh-char text-4xl font-medium text-slate-800">${escapeHtml(entry.c)}</div>
                    <div class="text-[11px] font-semibold text-indigo-500 text-center mt-1">${escapeHtml(entry.p)}</div>
                    <div class="text-[11px] leading-snug text-slate-600 text-center mt-1">${escapeHtml(meaning)}</div>
                    <div class="text-[10px] leading-snug text-slate-400 text-center mt-1">${examples}</div>
                `;
                studyGrid.appendChild(card);
            });
        }

        function renderPrimitiveGrid() {
            studyGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-12";

            primitives.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-4 flex flex-col items-center shadow-sm hover:shadow-md transition-shadow";
                card.innerHTML = `
                    <div class="w-full text-left text-xs font-semibold text-slate-300 mb-1">#${item.n}</div>
                    <div class="zh-char text-4xl font-medium text-slate-800 mb-2">${escapeHtml(item.c)}</div>
                    <div class="text-sm font-semibold text-indigo-500 mb-1">${escapeHtml(item.p)}</div>
                    <div class="text-[11px] leading-snug text-slate-500 text-center">${escapeHtml(capitalize(item[currentLang]))}</div>
                `;
                studyGrid.appendChild(card);
            });
        }

        // Initialize Game
        window.onload = function() {
            let savedLang = 'en';
            try {
                const stored = localStorage.getItem(LANG_STORAGE_KEY);
                if (stored && I18N[stored]) savedLang = stored;
            } catch {}

            setLanguage(savedLang);
            generateQuestion();
        };

    </script>
</body>
</html>
